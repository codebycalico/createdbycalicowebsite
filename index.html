<!-- 
    calico rose's website - createdbycalico.com 
    this is the landing / home page. Very simple, split screen style
    that takes the viewer to two different html websites.
    head holds the metadata for teh website.
    body holds what's actually showing on the website.
-->

<!doctype html>
<html lang="en">
    <head>
        <title>Calico Rose Randall - Photographer and Software Engineer</title>
        <meta
            name="description"
            content="Calico Rose Randall is a software and firmware engineer and freelance photographer in Portland, OR." />
        <meta
            name="google-site-verification"
            content="5k2riARQbzUHUYj6phSeDKuAYEUC3C1v8i_gIaayoAg" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/x-icon" href="favicon.png" />
    </head>
    <body>
        <div class="split photography">
            <a
                href="https://createdbycalico.com/photography/photography"
                class="split-link">
                <span class="split-label">photography</span>
            </a>
        </div>
        <div class="split tech">
            <!-- attaach a canvas and id so the background of the section can be customized. -->
            <canvas id="tech-canvas"></canvas>
            <a
                href="https://createdbycalico,com/technology/tech"
                class="split-link">
                <span class="split-label" data-text="technology"></span>
            </a>
        </div>
        <!-- this line is for the javascript background of the technology section and the
        typewriter effect on hovering.
        scripts go at the bottom so that the html loads first. -->
        <script src="tech-bg.js"></script>
        <script src="landing.js"></script>
    </body>
</html>
